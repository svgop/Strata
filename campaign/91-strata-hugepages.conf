# The boot-reserved 2 MiB core (HOSTMEM-NO-REBOOT.md M5, promoted to primary after the root probe
# killed shmem huge folios on this kernel).  45056 pages = 88 GiB covers the standing rotation:
# the store copy ~38 GiB + the largest single arena among GSQ's complement (37.6 GiB, T35 C2) and
# UD-IQ2_XS's arena (39.4 GiB, MAP_HUGETLB) + the KV host shadow (~3 GiB), with slack.  Engines
# stop/start return whole pages to the pool - restart is a perfect re-arm, forever, and nothing
# the box does afterward can fragment the pool.
# At boot the buddy is pristine so the reservation is whole; at RUNTIME it can come up short
# (kernel docs: silently partial) - if ever short, run `echo 1 > /proc/sys/vm/compact_memory`
# (engine down) and re-raise in steps.
# The 94 GiB UD-IQ4_XS config (56 GiB arena + store) and DS boots need their own pool policy -
# sized at their ladder legs; see the doc's sizing table.
vm.nr_hugepages=45056
