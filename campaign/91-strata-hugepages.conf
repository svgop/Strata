# The boot-reserved 2 MiB core (HOSTMEM-NO-REBOOT.md M5, promoted to primary after the root probe
# killed shmem huge folios on this kernel).  54272 pages = 106 GiB, sized by the DS study
# (2026-11-07-preboot-ds-pool-sizing.md): DeepSeek's CPU-lane expert copy is ALL-OR-NONE - its
# huge-page arena auto-arms only when HugePages_Free >= "all" (110.85 GB measured), and a smaller
# pool both disarms it AND shrinks the copy budget below the line (no copy at all - a regression,
# not neutrality).  106 GiB covers DS worst case + 2 GiB slack (105 GiB sat 124 pages from the
# cliff), the Qwen worst concurrent draw (store 38 + largest arena 39.4 + KV ~3 = 80.4 GiB), and
# the UD-IQ4_XS config whole (56 + 38 = 94 GiB); ~78 GiB general remains.
# Engines stop/start return whole pages to the pool - restart is a perfect re-arm, forever, and
# nothing the box does afterward can fragment the pool.  At boot the buddy is pristine so the
# reservation is whole; at RUNTIME it can come up short (kernel docs: silently partial) - if ever
# short, run `echo 1 > /proc/sys/vm/compact_memory` (engine down) and re-raise in steps.
vm.nr_hugepages=54272
