# M2 (campaign/HOSTMEM-NO-REBOOT.md): raise kcompactd's background coalescing effort so the
# 2 MiB supply (the free order-9 blocks the expert arena's #2126 guard checks at every boot)
# refills between engine cycles instead of only decaying.  Default is 20; the kernel-mechanics
# digest (2026-11-07-hostmem-kernel-state) puts the useful band at 40-50.  Watch kcompactd CPU
# under idle; drop back toward 20 if it is ever visible.
# Install: sudo cp campaign/90-strata-vm.conf /etc/sysctl.d/ && sudo sysctl --system
vm.compaction_proactiveness=40
